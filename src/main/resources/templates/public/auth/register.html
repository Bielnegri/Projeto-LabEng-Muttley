<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Cadastro | Muttley')}"></head>
<body class="auth-body">
<main class="auth-page register-page">
    <section class="auth-visual register-visual">
        <a class="brand auth-brand" th:href="@{/login}" href="/login">Muttley</a>
    </section>

    <section class="auth-panel register-panel" aria-labelledby="register-title">
        <div class="auth-heading">
            <span class="auth-kicker">Cadastro</span>
            <h1 id="register-title">Criar cadastro</h1>
        </div>

        <form class="event-form auth-form register-form" data-auth-form th:action="@{/public/auth/register/salvar}" method="POST">
            <div class="form-grid">
                <label class="field">
                    <span>Nome</span>
                    <input type="text" name="nome" autocomplete="name" placeholder="Nome completo" required>
                </label>

                <label class="field">
                    <span>Email</span>
                    <input type="email" name="email" autocomplete="email" placeholder="seu.email@exemplo.com" required>
                </label>

                <label class="field">
                    <span>Telefone</span>
                    <input type="tel" name="telefone" autocomplete="tel" placeholder="(11) 99999-9999" required>
                </label>

                <label class="field">
                    <span>CPF</span>
                    <input type="text" name="cpf" inputmode="numeric" autocomplete="off" placeholder="000.000.000-00" required>
                </label>

                <label class="field">
                    <span>Senha</span>
                    <input type="password" name="senha" autocomplete="new-password" placeholder="Crie uma senha" required>
                </label>

                <label class="field">
                    <span>Confirmar senha</span>
                    <input type="password" name="confirmarSenha" autocomplete="new-password" placeholder="Repita a senha" required>
                </label>

                <label class="field description-field">
                    <span>Especialização</span>
                    <select name="especializacao" id="especializacao" data-specialty-select required onchange="alterarCampos()">
                        <option value="aluno" selected>Aluno</option>
                        <option value="professor">Professor</option>
                        <option value="palestrante">Palestrante</option>
                        <option value="organizador">Organizador</option>
                        <option value="colaborador">Colaborador</option>
                    </select>
                </label>
            </div>

            <div class="specialty-fields">
                <fieldset class="specialty-panel" data-specialty-panel="aluno" id="fieldsetAluno">
                    <legend>Dados de aluno</legend>
                    <div class="form-grid">
                        <label class="field">
                            <span>Instituição</span>
                            <input type="text" name="alunoInstituicao" placeholder="FATEC Zona Leste">
                        </label>
                        <label class="field">
                            <span>Matrícula</span>
                            <input type="text" name="matricula" placeholder="Número de matrícula">
                        </label>
                    </div>
                </fieldset>

                <fieldset class="specialty-panel" data-specialty-panel="professor" id="fieldsetProfessor" style="display: none">
                    <legend>Dados de professor</legend>
                    <div class="form-grid">
                        <label class="field">
                            <span>Área de formação</span>
                            <input type="text" name="areaFormacao" placeholder="Ex: Engenharia de Software">
                        </label>
                        <label class="field">
                            <span>Titulação</span>
                            <input type="text" name="titulacao" placeholder="Ex: Mestre, Doutor">
                        </label>
                    </div>
                </fieldset>

                <fieldset class="specialty-panel" data-specialty-panel="palestrante" id="fieldsetPalestrante" style="display: none">
                    <legend>Dados de palestrante</legend>
                    <div class="form-grid">
                        <label class="field">
                            <span>Empresa atual</span>
                            <input type="text" name="empresaAtual" placeholder="Empresa ou instituição">
                        </label>
                        <label class="field">
                            <span>Cargo</span>
                            <input type="text" name="palestranteCargo" placeholder="Cargo atual">
                        </label>
                        <label class="field description-field">
                            <span>Resumo profissional</span>
                            <textarea name="resumoProfissional" placeholder="Resumo da atuação profissional"></textarea>
                        </label>
                    </div>
                </fieldset>

                <fieldset class="specialty-panel" data-specialty-panel="organizador" id="fieldsetOrganizador" style="display: none">
                    <legend>Dados de organizador</legend>
                    <div class="form-grid">
                        <label class="field">
                            <span>Instituição</span>
                            <input type="text" name="organizadorInstituicao" placeholder="Instituição vinculada">
                        </label>
                        <label class="field">
                            <span>Cargo</span>
                            <input type="text" name="organizadorCargo" placeholder="Cargo na organização">
                        </label>
                    </div>
                </fieldset>

                <fieldset class="specialty-panel" data-specialty-panel="colaborador" id="fieldsetColaborador" style="display: none">
                    <legend>Dados de colaborador</legend>
                    <div class="form-grid">
                        <label class="field">
                            <span>Função</span>
                            <input type="text" name="funcao" placeholder="Função no evento">
                        </label>
                        <label class="field">
                            <span>Disponibilidade</span>
                            <input type="text" name="disponibilidade" placeholder="Ex: Manhã, tarde, noite">
                        </label>
                        <label class="field description-field">
                            <span>Tipo</span>
                            <input type="text" name="tipo" placeholder="Ex: Apoio, monitoria, recepção">
                        </label>
                    </div>
                </fieldset>
            </div>

            <p class="auth-status" data-auth-status role="status" aria-live="polite"></p>

            <div class="form-actions auth-actions">
                <a th:href="@{/login}" href="/login">Já tenho conta</a>
                <button class="primary-action" type="submit">Criar cadastro</button>
            </div>
        </form>
    </section>
</main>
<script language="javascript">
    function alterarCampos(){
        const selecao = document.getElementById("especializacao").value;
        const fieldsetAluno = document.getElementById("fieldsetAluno");
        const fieldsetProfessor = document.getElementById("fieldsetProfessor");
        const fieldsetPalestrante = document.getElementById("fieldsetPalestrante");
        const fieldsetOrganizador = document.getElementById("fieldsetOrganizador");
        const fieldsetColaborador = document.getElementById("fieldsetColaborador");

        const inputsAluno = fieldsetAluno.querySelectorAll("input")
        const inputsProfessor = fieldsetProfessor.querySelectorAll("input")
        const inputsPalestrante = fieldsetPalestrante.querySelectorAll("input")
        const inputsOrganizador = fieldsetOrganizador.querySelectorAll("input")
        const inputsColaborador = fieldsetColaborador.querySelectorAll("input")

        fieldsetAluno.style.display = "none"
        fieldsetProfessor.style.display = "none"
        fieldsetPalestrante.style.display = "none"
        fieldsetOrganizador.style.display = "none"
        fieldsetColaborador.style.display = "none"

        inputsAluno.forEach(input => input.required = false);
        inputsProfessor.forEach(input => input.required = false);
        inputsPalestrante.forEach(input => input.required = false);
        inputsOrganizador.forEach(input => input.required = false);
        inputsColaborador.forEach(input => input.required = false);

        if(selecao === "aluno"){
            fieldsetAluno.style.display = "block";
            inputsAluno.forEach(input => input.required = true);
        }
        else if(selecao === "professor"){
            fieldsetProfessor.style.display = "block";
            inputsProfessor.forEach(input => input.required = true);
        }
        else if(selecao === "palestrante"){
            fieldsetPalestrante.style.display = "block";
            inputsPalestrante.forEach(input => input.required = true);
        }
        else if(selecao === "organizador"){
            fieldsetOrganizador.style.display = "block";
            inputsOrganizador.forEach(input => input.required = true);
        }
        else if(selecao === "colaborador"){
            fieldsetColaborador.style.display = "block";
            inputsColaborador.forEach(input => input.required = true);
        }
    }
</script>
</body>
</html>
