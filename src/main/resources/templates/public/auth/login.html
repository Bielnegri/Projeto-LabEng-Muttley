<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Login | Muttley')}"></head>
<body class="auth-body">
<main class="auth-page">
    <section class="auth-visual">
        <a class="brand auth-brand" th:href="@{/login}" href="/login">Muttley</a>
    </section>

    <section class="auth-panel" aria-labelledby="login-title">
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

        <div class="auth-heading">
            <span class="auth-kicker">Acesso</span>
            <h1 id="login-title">Entrar no Muttley</h1>
        </div>

        <form class="event-form auth-form" data-auth-form  th:action="@{/public/auth/login/entrar}" method="POST">
            <label class="field">
                <span>CPF</span>
                <input type="text" name="cpf" id="cpf" placeholder="000.000.000-00" required>
            </label>

            <label class="field">
                <span>Senha</span>
                <input type="password" name="senha" autocomplete="current-password" placeholder="Sua senha" required>
            </label>

            <div class="auth-options">
                <label class="checkbox-field">
                    <input type="checkbox" name="lembrar">
                    <span>Lembrar acesso</span>
                </label>
                <a th:href="@{/register}" href="/register">Criar conta</a>
            </div>

            <p class="auth-status" data-auth-status role="status" aria-live="polite"></p>

            <button class="primary-action auth-submit" type="submit">Entrar</button>
        </form>
    </section>
</main>
<script>
    const inputCpf = document.getElementById('cpf');

    inputCpf.addEventListener('input', () => {
        let value = inputCpf.value;

        value = value.replace(/\D/g, '');

        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d)/, '$1.$2');
        value = value.replace(/(\d{3})(\d{1,2})$/, '$1-$2');

        inputCpf.value = value;
    });
</script>
</body>
</html>
