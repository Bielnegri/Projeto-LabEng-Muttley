<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Organizadores | Muttley')}"></head>
<body>
<header th:replace="~{fragmentos/header :: header(activePage='participantes')}"></header>

<main class="admin-page">
    <div class="page-title-row">
        <h1>Organizadores</h1>
    </div>

    <section class="people-panel">
        <table class="participants-table">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Telefone</th>
                <th>Instituição</th>
                <th>Cargo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(organizadores)}">
                <td colspan="5">Nenhum organizador cadastrado.</td>
            </tr>
            <tr th:each="organizador : ${organizadores}">
                <td th:text="${organizador.pessoa != null ? organizador.pessoa.nome : '-'}">Nome</td>
                <td th:text="${organizador.pessoa != null ? organizador.pessoa.email : '-'}">email@exemplo.com</td>
                <td th:text="${organizador.pessoa != null ? organizador.pessoa.telefone : '-'}">(11) 99999-0000</td>
                <td th:text="${organizador.instituicao}">Instituição</td>
                <td th:text="${organizador.cargo}">Cargo</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragmentos/footer :: footer}"></footer>
</body>
</html>
