<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Palestrantes | Muttley')}"></head>
<body>
<header th:replace="~{fragmentos/header :: header(activePage='participantes')}"></header>

<main class="admin-page">
    <div class="page-title-row">
        <h1>Palestrantes</h1>
    </div>

    <section class="people-panel">
        <table class="participants-table">
            <thead>
            <tr>
                <th>Nome</th>
                <th>Email</th>
                <th>Empresa</th>
                <th>Cargo</th>
                <th>Resumo</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${#lists.isEmpty(palestrantes)}">
                <td colspan="5">Nenhum palestrante cadastrado.</td>
            </tr>
            <tr th:each="palestrante : ${palestrantes}">
                <td th:text="${palestrante.pessoa != null ? palestrante.pessoa.nome : '-'}">Nome</td>
                <td th:text="${palestrante.pessoa != null ? palestrante.pessoa.email : '-'}">email@exemplo.com</td>
                <td th:text="${palestrante.empresaAtual}">Empresa</td>
                <td th:text="${palestrante.cargo}">Cargo</td>
                <td th:text="${palestrante.resumoProfissional}">Resumo</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>

<footer th:replace="~{fragmentos/footer :: footer}"></footer>
</body>
</html>
