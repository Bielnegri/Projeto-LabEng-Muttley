<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Eventos | Muttley')}"></head>
<body>
<header th:replace="~{fragmentos/header :: header(activePage='eventos')}"></header>

<main class="admin-page">
    <div class="page-title-row">
        <h1>Eventos</h1>
        <a class="new-event-button" th:href="@{/admin/novoEvento}">Novo Evento</a>
    </div>

    <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <section class="summary-grid" aria-label="Resumo de eventos">
        <article class="summary-card">
            <div>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                    <path d="M8 3v4M16 3v4M4 10h16"></path>
                </svg>
                <span>Próximos eventos</span>
            </div>
            <strong th:text="${paginaEventos.totalElements}">0</strong>
        </article>

        <article class="summary-card">
            <div>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                    <path d="M8 3v4M16 3v4M4 10h16"></path>
                </svg>
                <span>Página atual</span>
            </div>
            <strong th:text="${paginaEventos.number + 1} + ' / ' + ${paginaEventos.totalPages > 0 ? paginaEventos.totalPages : 1}">1 / 1</strong>
        </article>

        <article class="summary-card">
            <div>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="M16 21v-2a4 4 0 0 0-8 0v2"></path>
                    <circle cx="12" cy="7" r="4"></circle>
                </svg>
                <span>Exibindo</span>
            </div>
            <strong th:text="${paginaEventos.numberOfElements}">0</strong>
        </article>

        <article class="summary-card">
            <div>
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                    <path d="M8 3v4M16 3v4M4 10h16"></path>
                </svg>
                <span>Por página</span>
            </div>
            <strong th:text="${tamanho}">10</strong>
        </article>
    </section>

    <form class="events-toolbar" method="get" th:action="@{/admin/eventos}" aria-label="Filtros de eventos" id="filtros-form">
        <label class="search-field">
            <svg aria-hidden="true" viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7"></circle>
                <path d="m20 20-3.5-3.5"></path>
            </svg>
            <input type="search" name="busca" th:value="${busca}" placeholder="Buscar evento">
        </label>

        <select name="ordenar" aria-label="Ordenar eventos" onchange="document.getElementById('filtros-form').submit()">
            <option value="data" th:selected="${ordenar == 'data'}">Data</option>
            <option value="tema" th:selected="${ordenar == 'tema'}">Nome</option>
        </select>

        <select name="tamanho" aria-label="Quantidade exibida" onchange="document.getElementById('filtros-form').submit()">
            <option value="10" th:selected="${tamanho == 10}">10</option>
            <option value="25" th:selected="${tamanho == 25}">25</option>
            <option value="50" th:selected="${tamanho == 50}">50</option>
        </select>

        <input type="hidden" name="pagina" value="0">
        <button type="submit">Buscar</button>
    </form>

    <section class="event-list" aria-label="Lista de eventos">
        <p th:if="${paginaEventos.empty}" style="padding: 1rem;">Nenhum próximo evento encontrado.</p>

        <article class="event-list-card" th:each="evento : ${paginaEventos.content}">
            <div class="event-thumb" aria-hidden="true"></div>
            <div class="event-list-meta">
                <span>
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <path d="M12 21s7-5.3 7-12a7 7 0 0 0-14 0c0 6.7 7 12 7 12z"></path>
                        <circle cx="12" cy="9" r="2.2"></circle>
                    </svg>
                    <span th:text="${evento.local != null ? evento.local.nome : '—'}">Local</span>
                </span>
                <span>
                    <svg aria-hidden="true" viewBox="0 0 24 24">
                        <rect x="4" y="5" width="16" height="15" rx="2"></rect>
                        <path d="M8 3v4M16 3v4M4 10h16"></path>
                    </svg>
                    <span th:text="${#dates.format(evento.data, 'dd/MM')} + '&nbsp;&nbsp;' + ${evento.horarioInicio} + ' - ' + ${evento.horarioFim}">00/00 00:00 - 00:00</span>
                </span>
            </div>
            <div class="event-list-content">
                <h2 th:text="${evento.tema}">Tema</h2>
                <div class="event-tags">
                    <span>
                        <svg aria-hidden="true" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M12 7v5l3 3"></path>
                        </svg>
                        <span th:text="${evento.status}">Status</span>
                    </span>
                    <span th:if="${evento.disciplina != null}">
                        <svg aria-hidden="true" viewBox="0 0 24 24">
                            <path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-1.5z"></path>
                        </svg>
                        <span th:text="${evento.disciplina.nome}">Disciplina</span>
                    </span>
                    <span th:if="${evento.patrocinador != null}">
                        <svg aria-hidden="true" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="9"></circle>
                            <path d="M8 12h8M12 8v8"></path>
                        </svg>
                        <span th:text="${evento.patrocinador.nome}">Patrocinador</span>
                    </span>
                    <span>
                        <svg aria-hidden="true" viewBox="0 0 24 24">
                            <rect x="3" y="3" width="18" height="18" rx="2"></rect>
                            <path d="M9 9h6M9 13h4"></path>
                        </svg>
                        <span th:text="${evento.modalidade}">Modalidade</span>
                    </span>
                </div>
            </div>
            <div class="event-actions">
                <a th:href="@{/admin/novoEvento(id=${evento.id})}">Editar</a>
                <a th:href="@{/admin/eventos/{id}/qrcode(id=${evento.id})}"
                   th:if="${evento.qrCodeUrl != null}">QR Code</a>
                <form th:action="@{/admin/eventos/{id}/concluir(id=${evento.id})}" method="post"
                      onsubmit="return confirm('Concluir este evento e notificar participantes?')">
                    <button type="submit" class="concluir">Concluir</button>
                </form>
                <a th:if="${evento.status != null and evento.status.name() == 'EM_ANDAMENTO'}"
                   th:href="@{/admin/eventos/concluir/{id}(id=${evento.id})}">Concluir evento</a>
                <a th:href="@{/admin/deletar/{id}(id=${evento.id})}"
                   onclick="return confirm('Cancelar este evento?')"
                   class="danger">Cancelar</a>
            </div>
        </article>
    </section>

    <nav class="pagination" aria-label="Paginação de eventos" th:if="${paginaEventos.totalPages > 0}">
        <a th:href="@{/admin/eventos(busca=${busca},ordenar=${ordenar},tamanho=${tamanho},pagina=0)}"
           th:classappend="${paginaEventos.first} ? 'disabled'">Primeiro</a>

        <a th:href="@{/admin/eventos(busca=${busca},ordenar=${ordenar},tamanho=${tamanho},pagina=${paginaEventos.number - 1})}"
           th:classappend="${!paginaEventos.hasPrevious()} ? 'disabled'">Anterior</a>

        <th:block th:each="i : ${#numbers.sequence(0, paginaEventos.totalPages - 1)}">
            <a th:href="@{/admin/eventos(busca=${busca},ordenar=${ordenar},tamanho=${tamanho},pagina=${i})}"
               th:text="${i + 1}"
               th:classappend="${i == paginaEventos.number} ? 'active'">1</a>
        </th:block>

        <a th:href="@{/admin/eventos(busca=${busca},ordenar=${ordenar},tamanho=${tamanho},pagina=${paginaEventos.number + 1})}"
           th:classappend="${!paginaEventos.hasNext()} ? 'disabled'">Próximo</a>

        <a th:href="@{/admin/eventos(busca=${busca},ordenar=${ordenar},tamanho=${tamanho},pagina=${paginaEventos.totalPages - 1})}"
           th:classappend="${paginaEventos.last} ? 'disabled'">Último</a>
    </nav>
</main>

<footer th:replace="~{fragmentos/footer :: footer}"></footer>
</body>
</html>
