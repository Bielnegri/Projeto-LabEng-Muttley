<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head :: head('Disciplina | Muttley')}"></head>
<body>
<header th:replace="~{fragmentos/header :: header(activePage='disciplinas')}"></header>

<main class="admin-page">
    <h1 th:text="${disciplina.id != null} ? 'Editar disciplina' : 'Nova disciplina'">Nova disciplina</h1>

    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <form class="event-form" th:action="@{/admin/disciplinas/salvar}" method="post" th:object="${disciplina}">
        <input type="hidden" th:field="*{id}">

        <div class="form-grid">
            <label class="field">
                <span>Nome:</span>
                <input type="text" th:field="*{nome}" placeholder="Nome da disciplina">
                <span class="field-error" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></span>
            </label>

            <label class="field">
                <span>Turno:</span>
                <input type="text" th:field="*{turno}" placeholder="Ex: Matutino, Vespertino, Noturno">
                <span class="field-error" th:if="${#fields.hasErrors('turno')}" th:errors="*{turno}"></span>
            </label>

            <label class="field">
                <span>Professor:</span>
                <select th:field="*{id_professor}">
                    <option value="">Selecione um professor</option>
                    <option th:each="professor : ${professores}"
                            th:value="${professor.id}"
                            th:text="${professor.pessoa != null ? professor.pessoa.nome : professor.titulacao}">
                        Professor
                    </option>
                </select>
            </label>

            <label class="field description-field">
                <span>Descrição:</span>
                <textarea th:field="*{descricao}" placeholder="Resumo da disciplina"></textarea>
                <span class="field-error" th:if="${#fields.hasErrors('descricao')}" th:errors="*{descricao}"></span>
            </label>
        </div>

        <div class="form-actions">
            <a th:href="@{/admin/disciplinas}">Cancelar</a>
            <button class="primary-action" type="submit"
                    th:text="${disciplina.id != null} ? 'Salvar alterações' : 'Criar disciplina'">Criar disciplina</button>
        </div>
    </form>
</main>

<footer th:replace="~{fragmentos/footer :: footer}"></footer>
</body>
</html>
