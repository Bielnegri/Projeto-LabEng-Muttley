<header class="app-header" th:fragment="header(activePage)">
    <a class="brand" th:href="@{/admin/inicio}" href="/admin/inicio">Muttley</a>

    <nav class="main-nav" aria-label="Navegacao principal">
        <div class="nav-dropdown" th:classappend="${activePage == 'eventos' or activePage == 'certificados' or activePage == 'medalhas' or activePage == 'locais'} ? ' active' : ''">
            <button class="nav-dropdown__trigger" type="button" aria-haspopup="true" aria-expanded="false">
                Eventos
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="m6 9 6 6 6-6"></path>
                </svg>
            </button>
            <div class="nav-dropdown__menu" role="menu">
                <a role="menuitem" th:href="@{/admin/eventos}" href="/admin/eventos">Eventos</a>
                <a role="menuitem" th:href="@{/medalha/listagem}" href="/medalha/listagem">Medalhas</a>
                <a role="menuitem" th:href="@{/certificado/listagem}" href="/certificado/listagem">Certificados</a>
                <a role="menuitem" th:href="@{/local/listagem}" href="/local/listagem">Locais</a>
            </div>
        </div>
        <a th:classappend="${activePage == 'disciplinas'} ? ' active' : ''"
           th:href="@{/disciplina/listagem}" href="/disciplina/listagem">Disciplinas</a>
        <div class="nav-dropdown" th:classappend="${activePage == 'participantes'} ? ' active' : ''">
            <button class="nav-dropdown__trigger" type="button" aria-haspopup="true" aria-expanded="false">
                Participantes
                <svg aria-hidden="true" viewBox="0 0 24 24">
                    <path d="m6 9 6 6 6-6"></path>
                </svg>
            </button>
            <div class="nav-dropdown__menu" role="menu">
                <a role="menuitem" th:href="@{/admin/aluno}" href="/admin/aluno">Aluno</a>
                <a role="menuitem" th:href="@{/admin/professor}" href="/admin/professor">Professor</a>
                <a role="menuitem" th:href="@{/admin/palestrante}" href="/admin/palestrante">Palestrante</a>
                <a role="menuitem" th:href="@{/admin/organizador}" href="/admin/organizador">Organizador</a>
                <a role="menuitem" th:href="@{/admin/colaborador}" href="/admin/colaborador">Colaborador</a>
            </div>
        </div>
    </nav>

    <div class="user-menu" aria-label="Usuario logado">
        <span>Luciano</span>
        <span class="avatar" aria-hidden="true">
            <svg viewBox="0 0 24 24">
                <circle cx="12" cy="8" r="4"></circle>
                <path d="M4 21c1.6-4 4.2-6 8-6s6.4 2 8 6"></path>
            </svg>
        </span>
    </div>
</header>
